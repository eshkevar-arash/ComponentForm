<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>component form</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>


<div class="container">
    <div class="panel">
        <div class="panel__header">
            <h2 class="panel__title">با ما همراه شوید;درخشش در مدیریت</h2>
            <p class="panel__caption">از هم اکنون به راحتی افراد را مدیریت کنید</p>
        </div>
        <form action="#" class="form">
            <div class="form__row">
                <label class="form__label">نام و نام خانوادگی</label>
                <input type="text" class="form__input" placeholder="نام و نام خانوادگی">
            </div>
            <div class="form__row">
                <label class="form__label">ایمیل</label>
                <input type="text" class="form__input" placeholder="ایمیل">
            </div>
            <div class="form__row">
                <label class="form__label">پسورد</label>
                <input type="password" class="form__input" placeholder="پسورد">
            </div>
            <button type="submit" class="form__btn">ثبت نام</button>
        </form>
        <div class="panel__line">
            <span></span>
            <span>ورود با</span>
            <span></span>
        </div>
        <div class="panel__apps">
            <a href="#" class="panel__app">
                <span>Google</span>
                <img class="panel__icon" src="images/google.png" alt="">
            </a>
            <a href="#" class="panel__app">
                <span>Facebook</span>
                <img class="panel__icon" src="images/facebook.png" alt="">
            </a>
        </div>
    </div>
</div>


<script src="js/script.js"></script>
</body>
</html>
